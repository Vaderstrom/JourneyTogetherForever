# Packages the addon and uploads it to CurseForge and GitHub Releases
# when a tag like v0.1.0 is pushed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    # Actions are pinned to exact commits: the packager sees the CurseForge key and can write to the repository,
    # so a later change to an action only runs here once the pin is moved by hand.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CurseForge shows the whole CHANGELOG.md on each file; each GitHub release shows only its own version's section
      # ("## 0.10.0 beta (...)" for v0.10.0-beta), so GitHub's releases together hold the same history (the owner,
      # 1 Nov 2026). The packager writes the whole file to both; the last step sets GitHub's to the section. The run
      # stops when there is no section for this version, or when CHANGELOG.md grows past what a GitHub release can
      # hold for that moment (125,000 characters).
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version/-/ }"
          awk -v h="## $version " 'index($0, h) == 1 { on = 1; print; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has no section \"## $version\""; exit 1; fi
          if [ "$(wc -c < CHANGELOG.md)" -gt 125000 ]; then echo "CHANGELOG.md is too long for a GitHub release"; exit 1; fi
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
      - name: GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
